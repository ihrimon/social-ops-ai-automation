services:
  app:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - apps/backend/.env
    volumes:
      # The Dockerfile only COPYs this at build time — bind-mount it so an
      # admin-dashboard knowledge base edit made inside the running container
      # actually persists (survives a restart) instead of being lost.
      - ./apps/backend/knowledge-base.json:/app/apps/backend/knowledge-base.json
    environment:
      # Overrides whatever MONGODB_URI is in .env — inside compose's network,
      # the Mongo container is reachable by its service name, not localhost.
      MONGODB_URI: mongodb://mongo:27017/social-ops-ai-automation
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
